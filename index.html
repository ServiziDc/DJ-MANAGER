<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster DJ · Black Panther</title>
<meta name="description" content="Elenco dei DJ registrati al Black Panther: link stream, fusi orari, generi.">
<meta name="theme-color" content="#16141c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- I font sono dentro al pacchetto: la pagina resta identica anche senza internet -->
<link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Schermata di accesso: chiede la chiave la prima volta -->
<div class="gate" id="gate" hidden>
  <form class="gate__card" id="gateForm">
    <div class="gate__mark" aria-hidden="true"></div>
    <h1 class="gate__title">Roster DJ</h1>
    <p class="gate__text">Inserisci la chiave di accesso. Resta salvata su questo dispositivo.</p>
    <label class="field">
      <span class="field__label">Chiave</span>
      <input class="field__input" id="keyInput" type="password" autocomplete="current-password"
             spellcheck="false" required>
    </label>
    <label class="field" id="urlField" hidden>
      <span class="field__label">Indirizzo del server</span>
      <input class="field__input" id="urlInput" type="url" spellcheck="false"
             placeholder="http://192.168.1.16:8787">
    </label>
    <p class="gate__error" id="gateError" role="alert" hidden></p>
    <button class="btn btn--solid" type="submit" id="gateSubmit">Entra</button>
    <button class="btn btn--ghost" type="button" id="toggleUrl">Il server è su un altro indirizzo</button>
  </form>
</div>

<!-- Applicazione -->
<div class="app" id="app" hidden>

  <header class="bar">
    <div class="bar__brand">
      <span class="bar__club">Black&nbsp;Panther</span>
      <span class="bar__section">Roster DJ</span>
    </div>

    <div class="bar__search">
      <input class="search" id="search" type="search" placeholder="Cerca per nome, genere o paese"
             aria-label="Cerca un DJ" spellcheck="false">
    </div>

    <div class="filters" role="group" aria-label="Filtra l'elenco">
      <button class="chip is-on" data-filter="tutti" aria-pressed="true">Tutti</button>
      <button class="chip" data-filter="senza-logo" aria-pressed="false">Senza logo</button>
    </div>

    <div class="bar__tools">
      <button class="icon-btn" id="refresh" title="Aggiorna" aria-label="Aggiorna l'elenco">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="icon-btn" id="exportCsv" title="Scarica CSV" aria-label="Scarica l'elenco in CSV" download>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </header>

  <!-- Striscia di stato: compare solo quando c'è qualcosa da dire -->
  <div class="notice" id="notice" hidden>
    <span id="noticeText"></span>
    <button class="notice__action" id="noticeAction" hidden></button>
  </div>

  <main class="rack" id="rack" aria-live="polite">
    <p class="rack__loading" id="loading">Carico il roster…</p>
  </main>

  <footer class="foot">
    <span id="count"></span>
    <button class="linkish" id="forget">Dimentica la chiave</button>
  </footer>
</div>

<!-- Conferma di copia -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<template id="rowTemplate">
  <article class="dj">
    <span class="dj__strip" aria-hidden="true"></span>
    <div class="dj__logo">
      <img alt="" loading="lazy" decoding="async">
      <span class="dj__initials" aria-hidden="true"></span>
    </div>
    <div class="dj__id">
      <h2 class="dj__name"></h2>
      <p class="dj__meta"></p>
    </div>
    <p class="dj__styles"></p>
    <div class="dj__link">
      <code class="dj__url"></code>
      <div class="dj__actions">
        <button class="btn btn--quiet js-copy">Copia link</button>
        <a class="btn btn--quiet js-open" target="_blank" rel="noopener noreferrer">Apri</a>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
